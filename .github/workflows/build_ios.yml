name: Build iOS IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - name: Install Pods
        run: |
          cd ios
          pod install
          cd ..
      - run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r AeroPulse.zip Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: AeroPulse.zip
